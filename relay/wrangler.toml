name = "lotus-light"
main = "src/worker.js"
compatibility_date = "2026-10-01"

[vars]
ROOM = "main"
DOWNLOAD_URL = "https://github.com/Wraith0010/lotus-light/archive/refs/heads/main.zip"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[durable_objects.bindings]]
name = "RELAY"
class_name = "Relay"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Relay"]
